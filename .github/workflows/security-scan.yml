name: 🔒 Security Scan Suite

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

env:
  NODE_VERSION: '18.x'

jobs:
  # 1. Dependency Vulnerability Scanning
  dependency-scan:
    name: 🔍 Dependency Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 🔧 Install dependencies
      run: |
        cd backend && npm ci
        cd ../frontend && npm ci

    - name: 🔍 Backend npm audit
      run: |
        echo "🔍 Running npm audit on backend..."
        cd backend
        npm audit --audit-level=moderate --json > ../backend-audit.json || true
        npm audit --audit-level=moderate || echo "Found vulnerabilities in backend"

    - name: 🔍 Frontend npm audit
      run: |
        echo "🔍 Running npm audit on frontend..."
        cd frontend
        npm audit --audit-level=moderate --json > ../frontend-audit.json || true
        npm audit --audit-level=moderate || echo "Found vulnerabilities in frontend"

    - name: 📊 Process audit results
      run: |
        echo "📊 Processing audit results..."
        
        if [ -f backend-audit.json ]; then
          echo "Backend vulnerabilities:"
          cat backend-audit.json | jq -r '.vulnerabilities | to_entries[] | "\(.key): \(.value.severity)"' || echo "No vulnerabilities or parsing error"
        fi
        
        if [ -f frontend-audit.json ]; then
          echo "Frontend vulnerabilities:"
          cat frontend-audit.json | jq -r '.vulnerabilities | to_entries[] | "\(.key): \(.value.severity)"' || echo "No vulnerabilities or parsing error"
        fi

    - name: 📤 Upload audit results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-audit-results
        path: |
          backend-audit.json
          frontend-audit.json
        retention-days: 30

  # 2. SAST with CodeQL (GitHub's semantic code analysis)
  codeql-analysis:
    name: 🔬 CodeQL SAST Analysis
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🔬 Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-and-quality

    - name: 🔬 Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

  # 3. SAST with Semgrep (rule-based static analysis)
  semgrep-scan:
    name: 🛡️ Semgrep SAST Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🛡️ Run Semgrep
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/secrets
          p/owasp-top-ten
          p/javascript
          p/typescript
          p/react
          p/express
          p/mongodb
        generateSarif: "1"

    - name: 📤 Upload Semgrep results to artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: semgrep-sarif-results
        path: semgrep.sarif
        retention-days: 30

    - name: 📤 Upload Semgrep results to code scanning (if enabled)
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      continue-on-error: true
      with:
        sarif_file: semgrep.sarif

  # 4. Secret Scanning with TruffleHog
  secret-scan:
    name: 🔐 Secret Detection
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔐 TruffleHog OSS
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified

  # 5. License Compliance Scanning
  license-scan:
    name: 📄 License Compliance Check
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: 🔧 Install license-checker
      run: npm install -g license-checker

    - name: 📄 Check backend licenses
      run: |
        cd backend
        npm ci
        echo "📄 Backend license scan:"
        license-checker --summary
        license-checker --json > ../backend-licenses.json

    - name: 📄 Check frontend licenses
      run: |
        cd frontend
        npm ci
        echo "📄 Frontend license scan:"
        license-checker --summary
        license-checker --json > ../frontend-licenses.json

    - name: 📤 Upload license results
      uses: actions/upload-artifact@v4
      with:
        name: license-scan-results
        path: |
          backend-licenses.json
          frontend-licenses.json
        retention-days: 30

  # 6. Custom Security Rules Check
  custom-security-check:
    name: 🎯 Custom Security Rules
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🎯 Check for security anti-patterns
      run: |
        echo "🔍 Checking for common security issues..."
        
        # Check for hardcoded secrets/passwords
        echo "🔐 Scanning for potential hardcoded secrets..."
        if grep -r -i "password\s*=" --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" . | grep -v node_modules | grep -v ".git"; then
          echo "⚠️ WARNING: Potential hardcoded passwords found"
        fi
        
        # Check for console.log in production files
        echo "📝 Checking for console.log statements..."
        if find . -name "*.js" -o -name "*.jsx" -o -name "*.ts" -o -name "*.tsx" | grep -v node_modules | xargs grep -l "console\.log" | head -10; then
          echo "⚠️ WARNING: console.log statements found (may leak sensitive info)"
        fi
        
        # Check for eval() usage
        echo "⚡ Checking for dangerous eval() usage..."
        if grep -r "eval(" --include="*.js" --include="*.jsx" . | grep -v node_modules; then
          echo "🚨 CRITICAL: eval() usage found - potential code injection risk"
          exit 1
        fi
        
        # Check for SQL injection patterns
        echo "💉 Checking for potential SQL injection patterns..."
        if grep -r "query.*+.*req\." --include="*.js" . | grep -v node_modules; then
          echo "🚨 WARNING: Potential SQL injection pattern found"
        fi
        
        # Check for missing input validation
        echo "✅ Checking for input validation patterns..."
        if ! grep -r "joi\|yup\|validator" --include="*.js" . | grep -v node_modules > /dev/null; then
          echo "⚠️ WARNING: No input validation libraries detected"
        fi
        
        echo "✅ Custom security checks completed"

  # 7. Summary Report
  security-summary:
    name: 📋 Security Scan Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, codeql-analysis, semgrep-scan, secret-scan, license-scan, custom-security-check]
    if: always()
    
    steps:
    - name: 📋 Generate security summary
      run: |
        echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Scan Type | Status | Description |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|-------------|" >> $GITHUB_STEP_SUMMARY
        echo "| 🔍 Dependency Scan | ${{ needs.dependency-scan.result }} | NPM package vulnerability analysis |" >> $GITHUB_STEP_SUMMARY
        echo "| 🔬 CodeQL SAST | ${{ needs.codeql-analysis.result }} | GitHub semantic code analysis |" >> $GITHUB_STEP_SUMMARY
        echo "| 🛡️ Semgrep SAST | ${{ needs.semgrep-scan.result }} | Rule-based static analysis |" >> $GITHUB_STEP_SUMMARY
        echo "| 🔐 Secret Scan | ${{ needs.secret-scan.result }} | TruffleHog secret detection |" >> $GITHUB_STEP_SUMMARY
        echo "| 📄 License Check | ${{ needs.license-scan.result }} | License compliance verification |" >> $GITHUB_STEP_SUMMARY
        echo "| 🎯 Custom Rules | ${{ needs.custom-security-check.result }} | Custom security pattern detection |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📊 **Overall Status**: " >> $GITHUB_STEP_SUMMARY
        
        if [[ "${{ needs.dependency-scan.result }}" == "success" && "${{ needs.codeql-analysis.result }}" == "success" && "${{ needs.semgrep-scan.result }}" == "success" && "${{ needs.secret-scan.result }}" == "success" && "${{ needs.license-scan.result }}" == "success" && "${{ needs.custom-security-check.result }}" == "success" ]]; then
          echo "✅ All security scans passed!" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Some security scans found issues - review the detailed results" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📁 **Artifacts**: Check the workflow artifacts for detailed scan results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "💡 **Code Scanning Integration**: " >> $GITHUB_STEP_SUMMARY
        echo "To enable GitHub Code Scanning for enhanced security reporting:" >> $GITHUB_STEP_SUMMARY
        echo "1. Go to repository Settings → Security & Analysis" >> $GITHUB_STEP_SUMMARY
        echo "2. Enable 'Code scanning' feature" >> $GITHUB_STEP_SUMMARY
        echo "3. Re-run this workflow for integrated SARIF reporting" >> $GITHUB_STEP_SUMMARY